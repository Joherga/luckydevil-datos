name: Actualizar sorteos
on:
  schedule:
    - cron: '45 20,21,22 * * *'   # tras los sorteos de cada día (hora UTC; cubre horario de verano e invierno)
    - cron: '0 7 * * *'           # repaso diario por si algún sorteo llegó tarde
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar sorteos nuevos
        env:
          LOTERIAS_API_KEY: ${{ secrets.LOTERIAS_API_KEY }}
        run: python actualizar_datos.py --auto
      - name: Guardar cambios
        run: |
          git config user.name "luckydevil-bot"
          git config user.email "luckydevil-bot@users.noreply.github.com"
          git add datos.json
          git diff --staged --quiet || (git commit -m "Actualizar sorteos" && git push)
